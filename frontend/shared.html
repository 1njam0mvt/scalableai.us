<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Shared chat · ScalableAI</title>
    <link rel="icon" href="/favicon.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-0: #09090b;
            --bg-1: #0f0f12;
            --bg-2: #16161a;
            --bg-3: #1e1e24;
            --line: rgba(255, 255, 255, 0.06);
            --line-strong: rgba(255, 255, 255, 0.12);
            --ink-0: #f5f5f7;
            --ink-1: #b4b4bd;
            --ink-2: #82828d;
            --ink-3: #55555f;
            --violet: #9c6bff;
            --cyan: #4cd6e9;
            --accent-grad: linear-gradient(135deg, var(--violet), var(--cyan));
            --danger: #ff6b6b;
            --r-sm: 10px;
            --r-md: 14px;
            --r-lg: 20px;
            --r-pill: 999px;
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        [data-theme="light"] {
            --bg-0: #ffffff;
            --bg-1: #f7f7f8;
            --bg-2: #f0f0f2;
            --bg-3: #e7e7ea;
            --line: rgba(0, 0, 0, 0.09);
            --line-strong: rgba(0, 0, 0, 0.16);
            --ink-0: #17171a;
            --ink-1: #46464f;
            --ink-2: #6c6c76;
            --ink-3: #8f8f99;
            --violet: #7c3aed;
            --cyan: #0e94ab;
            --danger: #dc2626;
            --shadow-md: 0 8px 24px rgba(20, 20, 30, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg-0);
            color: var(--ink-0);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            transition: background 200ms ease, color 200ms ease;
        }

        .shared-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 20px;
            background: var(--bg-1);
            border-bottom: 1px solid var(--line);
        }

        .shared-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .shared-logo {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            flex: 0 0 auto;
        }

        .shared-header-text {
            min-width: 0;
        }

        .shared-title {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 46vw;
        }

        .shared-owner {
            font-size: 12px;
            color: var(--ink-2);
        }

        .shared-meta-row {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .shared-msg-count {
            display: none;
            align-items: center;
            gap: 4px;
            flex: 0 0 auto;
            font-size: 11px;
            font-weight: 600;
            color: var(--ink-2);
            background: var(--bg-2);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 2px 9px;
            white-space: nowrap;
        }

        .shared-msg-count.visible {
            display: inline-flex;
        }

        .shared-header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }

        .shared-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 34px;
            padding: 0 14px;
            border-radius: var(--r-pill);
            border: 1px solid var(--line-strong);
            background: var(--bg-2);
            color: var(--ink-0);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 150ms ease;
        }

        .shared-btn:hover {
            background: var(--bg-3);
        }

        .shared-btn.primary {
            background: var(--ink-0);
            color: var(--bg-1);
            border-color: transparent;
        }

        .shared-btn.primary:hover {
            opacity: 0.85;
            background: var(--ink-0);
        }

        .shared-icon-btn {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid var(--line-strong);
            background: var(--bg-2);
            color: var(--ink-1);
            cursor: pointer;
        }

        .shared-icon-btn:hover {
            background: var(--bg-3);
            color: var(--ink-0);
        }

        .shared-banner {
            max-width: 760px;
            margin: 14px auto 0;
            padding: 10px 16px;
            border-radius: var(--r-sm);
            background: var(--bg-2);
            border: 1px solid var(--line);
            color: var(--ink-2);
            font-size: 12.5px;
            text-align: center;
        }

        .shared-messages {
            max-width: 760px;
            margin: 0 auto;
            padding: 20px 20px 80px;
        }

        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 22px;
            align-items: flex-start;
        }

        .msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-2);
            overflow: hidden;
        }

        .msg-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .msg-avatar.user-avatar {
            background: var(--accent-grad);
            color: #fff;
            font-size: 12.5px;
            font-weight: 700;
        }

        .msg-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .message.user .msg-body {
            align-items: flex-end;
        }

        .msg-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-2);
        }

        .msg-content {
            font-size: 14.5px;
            line-height: 1.65;
            color: var(--ink-0);
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }

        .message.user .msg-content {
            background: var(--bg-2);
            border: 1px solid var(--line);
            padding: 10px 16px;
            border-radius: 18px 18px 4px 18px;
        }

        .artifact-file-card {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: var(--r-md);
            background: var(--bg-2);
            border: 1px solid var(--line);
            max-width: 420px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .artifact-file-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--r-sm);
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--violet);
            background: rgba(156, 107, 255, 0.14);
        }

        .artifact-file-info {
            flex: 1;
            min-width: 0;
        }

        .artifact-file-name {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--ink-0);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artifact-file-type {
            font-size: 11.5px;
            color: var(--ink-2);
            margin-top: 2px;
        }

        .artifact-file-download {
            width: 32px;
            height: 32px;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--r-sm);
            border: 1px solid var(--line);
            background: var(--bg-1);
            color: var(--ink-1);
            cursor: pointer;
        }

        .artifact-file-download:hover {
            background: var(--bg-3);
            color: var(--ink-0);
        }

        .shared-state-screen {
            max-width: 420px;
            margin: 14vh auto 0;
            padding: 0 20px;
            text-align: center;
        }

        .shared-state-screen h1 {
            font-size: 18px;
            margin: 14px 0 6px;
        }

        .shared-state-screen p {
            font-size: 13.5px;
            color: var(--ink-2);
            line-height: 1.6;
            margin: 0 0 18px;
        }

        .shared-state-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto;
            border-radius: 50%;
            background: var(--bg-2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-2);
        }

        .shared-footer {
            max-width: 760px;
            margin: 0 auto;
            padding: 14px 20px 40px;
            text-align: center;
            font-size: 12px;
            color: var(--ink-2);
        }

        .shared-footer a {
            color: var(--ink-1);
        }

        /* ---- Continue-the-conversation chat bar ---- */
        .shared-composer-wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 8px 20px 0;
        }

        .shared-composer-hint {
            font-size: 12px;
            color: var(--ink-2);
            text-align: center;
            margin: 0 0 10px;
        }

        .shared-composer {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: var(--bg-1);
            border: 1px solid var(--line-strong);
            border-radius: 20px;
            padding: 8px 8px 8px 16px;
        }

        .shared-composer-input {
            flex: 1 1 auto;
            min-width: 0;
            max-height: 120px;
            resize: none;
            border: none;
            background: transparent;
            color: var(--ink-0);
            font: inherit;
            font-size: 14.5px;
            line-height: 1.4;
            padding: 6px 0;
        }

        .shared-composer-input:focus {
            outline: none;
        }

        .shared-composer-input::placeholder {
            color: var(--ink-2);
        }

        .shared-composer-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 0 0 auto;
        }

        .shared-composer-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--ink-2);
            cursor: pointer;
            transition: background 150ms ease, color 150ms ease;
        }

        .shared-composer-btn:hover {
            background: var(--bg-2);
            color: var(--ink-0);
        }

        .shared-composer-btn svg {
            width: 18px;
            height: 18px;
            pointer-events: none;
        }

        .shared-composer-btn.mic-active {
            color: #ff5c5c;
            background: rgba(255, 92, 92, 0.12);
        }

        .shared-composer-btn.send-btn {
            background: var(--accent-grad);
            color: #fff;
        }

        .shared-composer-btn.send-btn:hover {
            filter: brightness(1.08);
        }

        .shared-composer-btn.send-btn:disabled {
            opacity: 0.4;
            cursor: default;
            filter: none;
        }

        @media (max-width: 560px) {
            .shared-title {
                max-width: 40vw;
            }

            .shared-btn span.shared-btn-label {
                display: none;
            }

            .shared-btn {
                padding: 0 10px;
            }
        }
    </style>
</head>

<body>

    <header class="shared-header">
        <div class="shared-header-left">
            <img class="shared-logo" src="/scalable-logo.png" alt="ScalableAI">
            <div class="shared-header-text">
                <div class="shared-title" id="shared-title">Shared chat</div>
                <div class="shared-meta-row">
                    <div class="shared-owner" id="shared-owner"></div>
                    <span class="shared-msg-count" id="shared-msg-count"></span>
                </div>
            </div>
        </div>
        <div class="shared-header-actions">
            <button class="shared-icon-btn" id="shared-theme-toggle" title="Toggle light / dark mode"
                aria-label="Toggle light and dark mode">
                <svg id="shared-theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
            <a class="shared-btn primary" href="/app/">
                <span class="shared-btn-label">Try ScalableAI</span>
            </a>
        </div>
    </header>

    <div class="shared-banner">This is a read-only, shared conversation. Replies you send in your own chats aren't
        visible here.</div>

    <main id="shared-content">
        <div class="shared-messages" id="shared-messages" style="display:none;"></div>
        <div class="shared-state-screen" id="shared-loading">
            <div class="shared-state-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 6v6l4 2" />
                </svg>
            </div>
            <h1>Loading shared chat…</h1>
        </div>
    </main>

    <div class="shared-composer-wrap" id="shared-composer-wrap" style="display:none;">
        <p class="shared-composer-hint">Have your own question about this? Start a new conversation.</p>
        <div class="shared-composer">
            <textarea id="shared-composer-input" class="shared-composer-input" rows="1"
                placeholder="Ask ScalableAI anything…"></textarea>
            <div class="shared-composer-actions">
                <button type="button" id="shared-mic-btn" class="shared-composer-btn" title="Speak your message"
                    aria-label="Speak your message">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                        <line x1="12" y1="19" x2="12" y2="23" />
                        <line x1="8" y1="23" x2="16" y2="23" />
                    </svg>
                </button>
                <button type="button" id="shared-speaker-btn" class="shared-composer-btn"
                    title="Read your message aloud" aria-label="Read your message aloud">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                        <path d="M15.5 8.5a5 5 0 0 1 0 7" />
                        <path d="M18.5 5.5a9 9 0 0 1 0 13" />
                    </svg>
                </button>
                <button type="button" id="shared-send-btn" class="shared-composer-btn send-btn" title="Send"
                    aria-label="Send" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="22" y1="2" x2="11" y2="13" />
                        <polygon points="22 2 15 22 11 13 2 9 22 2" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div class="shared-footer" id="shared-footer" style="display:none;">
        Shared via <a href="/app/">ScalableAI</a> — Just A Rather Very Intelligent System
    </div>

    <script>
        const THEME_KEY = 'scalable_theme';
        function applyStoredTheme() {
            let theme = null;
            try { theme = localStorage.getItem(THEME_KEY); } catch (e) { }
            if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
            const icon = document.getElementById('shared-theme-icon');
            if (icon) icon.innerHTML = theme === 'light'
                ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
                : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        }
        applyStoredTheme();
        const themeToggleBtn = document.getElementById('shared-theme-toggle');
        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
                const next = current === 'light' ? 'dark' : 'light';
                try { localStorage.setItem(THEME_KEY, next); } catch (e) { }
                applyStoredTheme();
            });
        }

        function escapeHtml(str) {
            if (typeof str !== 'string') return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        const EXT_LABELS = { py: 'PY', js: 'JS', jsx: 'JSX', ts: 'TS', tsx: 'TSX', html: 'HTML', htm: 'HTML', css: 'CSS', json: 'JSON', md: 'MD', txt: 'TXT', sh: 'SH', yaml: 'YAML', yml: 'YAML', sql: 'SQL', java: 'JAVA', c: 'C', cpp: 'C++', go: 'GO', rb: 'RUBY', php: 'PHP', xml: 'XML', csv: 'CSV' };

        function renderArtifact(art) {
            const filename = art.filename || 'artifact.txt';
            const label = art.label || EXT_LABELS[(filename.split('.').pop() || '').toLowerCase()] || (art.type || 'TXT').toUpperCase();
            const content = art.content || '';
            const card = document.createElement('div');
            card.className = 'artifact-file-card';
            card.innerHTML =
                '<div class="artifact-file-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></div>' +
                '<div class="artifact-file-info"><div class="artifact-file-name">' + escapeHtml(filename) + '</div><div class="artifact-file-type">' + escapeHtml(label) + '</div></div>' +
                '<button class="artifact-file-download" type="button" title="Download ' + escapeHtml(filename) + '"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>';
            card.querySelector('.artifact-file-download').addEventListener('click', () => {
                try {
                    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = filename;
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                } catch (e) { }
            });
            return card;
        }

        function renderMessage(msg, viewerInitial) {
            const wrap = document.createElement('div');
            wrap.className = 'message ' + (msg.role === 'assistant' ? 'assistant' : 'user');
            const avatar = document.createElement('div');
            if (msg.role === 'assistant') {
                avatar.className = 'msg-avatar';
                avatar.innerHTML = '<img src="/scalable-logo.png" alt="Scalable">';
            } else {
                avatar.className = 'msg-avatar user-avatar';
                // Uses the logged-in viewer's own initial (from their email)
                // when known; anonymous visitors just see a generic "U".
                avatar.textContent = viewerInitial || 'U';
            }
            const body = document.createElement('div');
            body.className = 'msg-body';
            const label = document.createElement('div');
            label.className = 'msg-label';
            label.textContent = msg.role === 'assistant' ? 'Scalable' : 'User';
            const content = document.createElement('div');
            content.className = 'msg-content';
            content.textContent = msg.content || '';
            body.appendChild(label);
            body.appendChild(content);
            (msg.artifacts || []).forEach(art => body.appendChild(renderArtifact(art)));
            wrap.appendChild(avatar);
            wrap.appendChild(body);
            return wrap;
        }

        function showState(iconSvg, title, subtitle) {
            const loading = document.getElementById('shared-loading');
            loading.innerHTML =
                '<div class="shared-state-icon">' + iconSvg + '</div>' +
                '<h1>' + escapeHtml(title) + '</h1>' +
                '<p>' + escapeHtml(subtitle) + '</p>' +
                '<a class="shared-btn primary" href="/app/"><span class="shared-btn-label">Go to ScalableAI</span></a>';
        }

        async function loadSharedChat() {
            const parts = window.location.pathname.split('/').filter(Boolean);
            const shareId = parts[parts.length - 1];
            if (!shareId || !/^[0-9a-f]{32}$/.test(shareId)) {
                showState(
                    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
                    'This link looks incomplete',
                    'Double-check the link you were sent — part of it may be missing.'
                );
                return;
            }
            let authToken = null;
            try { authToken = localStorage.getItem('scalable_auth_token'); } catch (e) { }
            try {
                const res = await fetch('/api/shared/' + encodeURIComponent(shareId), {
                    headers: authToken ? { 'Authorization': 'Bearer ' + authToken } : {},
                });
                if (!res.ok) {
                    const body = await res.json().catch(() => ({}));
                    if (res.status === 401) {
                        showState(
                            '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
                            'Log in to view this chat',
                            body.detail || 'This chat is only shared with people who were invited. Log in with the email it was shared to, then reopen this link.'
                        );
                        return;
                    }
                    if (res.status === 403) {
                        showState(
                            '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
                            "You don't have access to this chat",
                            body.detail || "This chat is only shared with people who were invited, and your account isn't on that list."
                        );
                        return;
                    }
                    showState(
                        '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>',
                        'This chat is no longer shared',
                        body.detail || 'The link may be invalid, or the person who shared it has turned sharing off.'
                    );
                    return;
                }
                const data = await res.json();
                document.title = (data.title || 'Shared chat') + ' · ScalableAI';
                document.getElementById('shared-title').textContent = data.title || 'Shared chat';
                document.getElementById('shared-owner').textContent = data.owner ? ('Shared by ' + data.owner) : '';
                const messagesEl = document.getElementById('shared-messages');
                const messageList = data.messages || [];
                const viewerInitial = data.viewer_initial || null;
                messageList.forEach(msg => messagesEl.appendChild(renderMessage(msg, viewerInitial)));
                const countEl = document.getElementById('shared-msg-count');
                if (countEl && messageList.length) {
                    countEl.textContent = messageList.length + (messageList.length === 1 ? ' message' : ' messages');
                    countEl.classList.add('visible');
                }
                document.getElementById('shared-loading').style.display = 'none';
                messagesEl.style.display = 'block';
                document.getElementById('shared-composer-wrap').style.display = 'block';
                document.getElementById('shared-footer').style.display = 'block';
            } catch (err) {
                showState(
                    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>',
                    'Could not load this chat',
                    'Check your connection and try reloading the page.'
                );
            }
        }

        loadSharedChat();
    </script>

    <script>
        /* Continue-the-conversation composer. This page never sends a
           message itself — it hands the typed text to the main app, which
           starts a brand new chat with it. Mic input and read-aloud use the
           browser's own Web Speech API, same as the main app. */
        (function () {
            const input = document.getElementById('shared-composer-input');
            const micBtn = document.getElementById('shared-mic-btn');
            const speakerBtn = document.getElementById('shared-speaker-btn');
            const sendBtn = document.getElementById('shared-send-btn');
            if (!input || !sendBtn) return;

            function autoGrow() {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 120) + 'px';
            }

            function refreshSendState() {
                sendBtn.disabled = input.value.trim().length === 0;
            }

            input.addEventListener('input', function () {
                autoGrow();
                refreshSendState();
            });

            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    goToNewChat();
                }
            });

            function goToNewChat() {
                const text = input.value.trim();
                if (!text) return;
                try { sessionStorage.setItem('scalable_pending_prompt', text); } catch (e) { }
                window.location.href = '/app/';
            }

            sendBtn.addEventListener('click', goToNewChat);

            // ---- Mic (speech-to-text), same API the main app uses ----
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognizer = null;
            let listening = false;

            if (SR) {
                recognizer = new SR();
                recognizer.continuous = false;
                recognizer.interimResults = false;
                recognizer.lang = 'en-US';

                recognizer.onresult = function (event) {
                    const transcript = event.results[0][0].transcript;
                    input.value = (input.value ? input.value + ' ' : '') + transcript;
                    autoGrow();
                    refreshSendState();
                };
                recognizer.onend = function () {
                    listening = false;
                    micBtn.classList.remove('mic-active');
                };
                recognizer.onerror = function () {
                    listening = false;
                    micBtn.classList.remove('mic-active');
                };

                micBtn.addEventListener('click', function () {
                    if (listening) {
                        recognizer.stop();
                        return;
                    }
                    try {
                        recognizer.start();
                        listening = true;
                        micBtn.classList.add('mic-active');
                    } catch (e) { }
                });
            } else {
                micBtn.disabled = true;
                micBtn.title = 'Voice input is not supported in this browser';
            }

            // ---- Speaker (read the typed message aloud) ----
            if ('speechSynthesis' in window) {
                speakerBtn.addEventListener('click', function () {
                    const text = input.value.trim();
                    if (!text) return;
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    window.speechSynthesis.speak(utterance);
                });
            } else {
                speakerBtn.disabled = true;
                speakerBtn.title = 'Read-aloud is not supported in this browser';
            }
        })();
    </script>

</body>
