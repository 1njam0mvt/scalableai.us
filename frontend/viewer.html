<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QW43LYP6E6"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-QW43LYP6E6');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScalableAI — Viewer</title>
    <script>
        /* Apply the saved theme before first paint (same key as the main app)
           so the page never flashes dark when the user chose light. */
        (function () {
            var t = 'dark';
            try { t = localStorage.getItem('scalable_theme') === 'light' ? 'light' : 'dark'; } catch (e) { }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        :root {
            --bg: #0a0a1a;
            --surface: #12122a;
            --border: rgba(255, 255, 255, 0.06);
            --text: #e8e6f0;
            --text-dim: #8b89a0;
            --accent: #7c6aef;
            --accent-hover: #6b5ce7;
            --success: #4ecdc4;
            --danger: #ff6b6b;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --radius: 16px;
            --topbar-bg: rgba(18, 18, 42, 0.8);
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-bg-hover: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
            --brand-blue: #2f6fed;
            --brand-blue-hover: #4f89ff;
            --brand-blue-glow: rgba(79, 137, 255, 0.55);
            color-scheme: dark;
        }

        /* Light theme: same variable names, so every component that already
           uses var(--bg) / var(--surface) / var(--text)... follows along. */
        [data-theme="light"] {
            --bg: #f4f4f8;
            --surface: #ffffff;
            --border: rgba(0, 0, 0, 0.10);
            --text: #16161d;
            --text-dim: #5d5b70;
            --accent: #6b57e8;
            --accent-hover: #5a47d6;
            --success: #12968c;
            --danger: #d63c3c;
            --topbar-bg: rgba(255, 255, 255, 0.85);
            --btn-bg: rgba(0, 0, 0, 0.04);
            --btn-bg-hover: rgba(0, 0, 0, 0.09);
            --shadow: 0 8px 32px rgba(20, 20, 60, 0.10);
            --brand-blue: #1a56d6;
            --brand-blue-hover: #2f6fed;
            --brand-blue-glow: rgba(26, 86, 214, 0.35);
            color-scheme: light;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .topbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: var(--topbar-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .topbar-title {
            display: inline-flex;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 7px 16px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--brand-blue), var(--brand-blue-hover));
            /* Opacity lives on the glow/border, not the element itself, so
               the badge stays solid and the text stays fully legible in
               both themes instead of washing out. */
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.14) inset,
                0 4px 18px var(--brand-blue-glow);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
        }

        [data-theme="light"] .topbar-title {
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.22) inset,
                0 4px 14px var(--brand-blue-glow);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Round theme toggle. Inverse contrast so it always pops:
           dark mode -> white circle with dark icon,
           light mode -> black circle with white icon. */
        .theme-toggle {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            width: 38px;
            height: 38px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid transparent;
            background: #ffffff;
            color: #12122a;
            cursor: pointer;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 4px 16px rgba(124, 106, 239, 0.28);
            transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .theme-toggle:hover {
            transform: scale(1.08) rotate(12deg);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2), 0 6px 22px rgba(124, 106, 239, 0.45);
        }

        .theme-toggle:active {
            transform: scale(0.94);
        }

        .theme-toggle:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
            pointer-events: none;
            transition: transform 0.35s ease, opacity 0.25s ease;
        }

        /* Show the icon for the mode you would switch TO:
           dark mode shows a sun, light mode shows a moon. */
        .theme-toggle .icon-moon { display: none; }
        .theme-toggle .icon-sun  { display: block; }

        [data-theme="light"] .theme-toggle {
            background: #16161d;
            color: #ffffff;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25), 0 4px 16px rgba(20, 20, 60, 0.28);
        }

        [data-theme="light"] .theme-toggle:hover {
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 6px 22px rgba(20, 20, 60, 0.4);
        }

        [data-theme="light"] .theme-toggle .icon-moon { display: block; }
        [data-theme="light"] .theme-toggle .icon-sun  { display: none; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--btn-bg);
            color: var(--text-dim);
            font-family: var(--font);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--btn-bg-hover);
            color: var(--text);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: transparent;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn svg {
            width: 16px;
            height: 16px;
        }

        .viewer-main {
            flex: 1;
            width: 100%;
            max-width: 960px;
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            overflow-y: auto;
            min-height: 0;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 60px 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(124, 106, 239, 0.15);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .loading-prompt {
            font-size: 0.82rem;
            color: var(--text-dim);
            opacity: 0.7;
            max-width: 500px;
            text-align: center;
            line-height: 1.5;
        }

        .error-msg {
            padding: 20px 28px;
            background: rgba(255, 107, 107, 0.08);
            border: 1px solid rgba(255, 107, 107, 0.15);
            border-radius: var(--radius);
            color: var(--danger);
            font-size: 0.85rem;
            text-align: center;
        }

        .image-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .image-frame {
            width: 100%;
            max-width: 820px;
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .image-frame img {
            width: 100%;
            height: auto;
            display: block;
        }

        .image-prompt {
            font-size: 0.82rem;
            color: var(--text-dim);
            text-align: center;
            padding: 0 16px;
            max-width: 600px;
            line-height: 1.5;
        }

        .content-container {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .content-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .content-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .content-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .content-prompt {
            font-size: 0.8rem;
            color: var(--text-dim);
            opacity: 0.7;
        }

        .content-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .content-editor-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .content-editor {
            width: 100%;
            flex: 1;
            min-height: 55vh;
            padding: 24px 28px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--font);
            font-size: 0.92rem;
            line-height: 1.8;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .content-editor:focus {
            border-color: rgba(124, 106, 239, 0.35);
            box-shadow: 0 0 0 3px rgba(124, 106, 239, 0.08);
        }

        .content-editor::-webkit-scrollbar {
            display: none;
        }

        .content-editor {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .content-editor::placeholder {
            color: var(--text-dim);
            opacity: 0.5;
        }

        /* ---- Live Edit ---- */

        /* Editable textarea, shown in place of .content-preview while
           editing (display toggled directly in JS, same as the preview
           pane). Reuses .content-editor's existing box styling so nothing
           shifts size when switching between view and edit. */
        .content-editor.live-edit-active {
            resize: none;
            min-height: 55vh;
        }

        /* Thin divider between the textarea and the Cancel/Save row,
           adapting to a lighter/darker line automatically via --border. */
        .content-edit-divider {
            height: 1px;
            background: var(--border);
            margin: 14px 0;
            flex-shrink: 0;
        }

        .content-edit-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-shrink: 0;
        }

        /* Large pill buttons for Cancel/Save — bigger and more rounded
           than the top-bar .btn, matching the reference Log in / Sign up
           pill shape. Colors are inherited from .btn / .btn-primary so
           dark/light contrast is already correct with no new variables. */
        .content-edit-actions .btn {
            padding: 10px 26px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Rendered, view-only preview of generated content. Same box look
           as .content-editor, but real formatting instead of raw
           #/**/- characters. */
        .content-preview {
            width: 100%;
            flex: 1;
            min-height: 55vh;
            padding: 24px 28px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--font);
            font-size: 0.92rem;
            line-height: 1.8;
            overflow-y: auto;
        }

        .content-preview h1,
        .content-preview h2,
        .content-preview h3 {
            margin: 0.6em 0 0.35em;
            line-height: 1.3;
            color: var(--text);
        }

        .content-preview h1:first-child,
        .content-preview h2:first-child,
        .content-preview h3:first-child {
            margin-top: 0;
        }

        .content-preview h1 {
            font-size: 1.35rem;
        }

        .content-preview h2 {
            font-size: 1.15rem;
        }

        .content-preview h3 {
            font-size: 1.02rem;
        }

        .content-preview p {
            margin: 0 0 0.9em;
        }

        .content-preview p:last-child {
            margin-bottom: 0;
        }

        .content-preview ul,
        .content-preview ol {
            margin: 0 0 0.9em;
            padding-left: 1.4em;
        }

        .content-preview li {
            margin: 0.25em 0;
        }

        .content-preview strong {
            font-weight: 700;
            color: var(--text);
        }

        .content-preview em {
            font-style: italic;
        }

        .content-preview code {
            font-family: 'Consolas', 'Menlo', monospace;
            font-size: 0.88em;
            background: var(--btn-bg);
            padding: 0.1em 0.4em;
            border-radius: 4px;
        }

        .content-wordcount {
            font-size: 0.7rem;
            color: var(--text-dim);
            opacity: 0.6;
            text-align: right;
            padding-top: 6px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-image {
            background: rgba(124, 106, 239, 0.12);
            color: var(--accent);
            border: 1px solid rgba(124, 106, 239, 0.15);
        }

        .badge-content {
            background: rgba(78, 205, 196, 0.1);
            color: var(--success);
            border: 1px solid rgba(78, 205, 196, 0.15);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            padding: 10px 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 0.82rem;
            z-index: 100;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 768px) {
            .topbar {
                padding: 12px 16px;
            }

            .topbar-right {
                gap: 8px;
            }

            .theme-toggle {
                width: 34px;
                height: 34px;
            }

            .theme-toggle svg {
                width: 16px;
                height: 16px;
            }

            .viewer-main {
                padding: 20px 16px;
                max-width: 100%;
            }

            .btn {
                padding: 7px 14px;
                font-size: 0.75rem;
            }

            .content-editor {
                padding: 20px;
                font-size: 0.86rem;
                min-height: 45vh;
            }

            .content-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 480px) {
            .topbar {
                padding: 10px 12px;
                gap: 8px;
            }

            .topbar-right {
                gap: 6px;
                min-width: 0;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .theme-toggle {
                width: 32px;
                height: 32px;
            }

            .theme-toggle svg {
                width: 15px;
                height: 15px;
            }

            .topbar-actions {
                gap: 4px;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .viewer-main {
                padding: 14px 10px;
            }

            .topbar-title {
                font-size: 0.75rem;
                padding: 6px 13px;
            }

            .btn {
                padding: 6px 10px;
                font-size: 0.7rem;
            }

            .content-editor {
                padding: 16px;
                font-size: 0.82rem;
                min-height: 40vh;
                line-height: 1.7;
            }

            .image-frame {
                border-radius: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="topbar">
        <span class="topbar-title">ScalableAI</span>
        <div class="topbar-right">
            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to light theme"
                title="Toggle theme">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4.5" />
                    <path d="M12 2v2.2M12 19.8V22M4.93 4.93l1.56 1.56M17.51 17.51l1.56 1.56M2 12h2.2M19.8 12H22M4.93 19.07l1.56-1.56M17.51 6.49l1.56-1.56" />
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
            <div class="topbar-actions" id="topbar-actions"></div>
        </div>
    </div>

    <div class="viewer-main" id="viewer-main">
        <div class="loading" id="loading-state">
            <div class="spinner"></div>
            <div class="loading-text">Working on it...</div>
            <div class="loading-prompt" id="loading-prompt"></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        /* Theme toggle. Shares the main app's storage key ('scalable_theme')
           and the data-theme attribute, so choosing light in the chat opens
           the viewer in light too, and vice versa. */
        (function () {
            var KEY = 'scalable_theme';
            var root = document.documentElement;
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;

            function current() {
                return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
            }
            function apply(theme) {
                root.setAttribute('data-theme', theme);
                btn.setAttribute('aria-label', theme === 'light' ? 'Switch to dark theme' : 'Switch to light theme');
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f4f8' : '#0a0a1a');
            }

            apply(current());

            btn.addEventListener('click', function () {
                var next = current() === 'light' ? 'dark' : 'light';
                apply(next);
                try { localStorage.setItem(KEY, next); } catch (e) { }
            });

            // Keep in sync if the theme is changed in another tab/window.
            window.addEventListener('storage', function (e) {
                if (e.key === KEY) apply(e.newValue === 'light' ? 'light' : 'dark');
            });
        })();
    </script>
    <script src="/api-config.js"></script>
    <script>
        (function () {
            const API = (typeof window.API_BASE === 'string' && window.API_BASE) || window.location.origin;
            const params = new URLSearchParams(window.location.search);
            const taskId = params.get('task_id');
            const mainEl = document.getElementById('viewer-main');
            const loadingEl = document.getElementById('loading-state');
            const actionsEl = document.getElementById('topbar-actions');
            const toastEl = document.getElementById('toast');
            const promptEl = document.getElementById('loading-prompt');
            const AUTH_TOKEN_KEY = 'scalable_auth_token';

            function authFetch(url, options) {
                const requestOptions = options || {};
                const headers = Object.assign({}, requestOptions.headers || {});
                try {
                    const token = localStorage.getItem(AUTH_TOKEN_KEY);
                    if (token) headers.Authorization = 'Bearer ' + token;
                } catch (_) { }
                return fetch(url, Object.assign({}, requestOptions, { headers }));
            }

            if (!taskId) {
                showError('No task ID provided. Please open this page from SCALABLE.');
                return;
            }
            let pollInterval = null;
            let pollCount = 0;
            const MAX_POLLS = 120;
            function poll() {
                pollCount++;
                if (pollCount > MAX_POLLS) {
                    clearInterval(pollInterval);
                    showError('Task timed out. Please try again.');
                    return;
                }
                authFetch(`${API}/tasks/${encodeURIComponent(taskId)}`)
                    .then(r => {
                        if (!r.ok) throw new Error(`HTTP ${r.status}`);
                        return r.json();
                    })
                    .then(data => {
                        if (data.status === 'completed') {
                            clearInterval(pollInterval);
                            renderResult(data);
                        } else if (data.status === 'failed') {
                            clearInterval(pollInterval);
                            showError(data.error || 'Task failed. Please try again.');
                        } else {
                            if (data.prompt && promptEl) {
                                promptEl.textContent = `"${data.prompt}"`;
                            }
                            if (data.label) {
                                const loadingText = loadingEl.querySelector('.loading-text');
                                if (loadingText) loadingText.textContent = data.label + '...';
                            }
                        }
                    })
                    .catch(err => {
                        console.warn('Poll error:', err);
                    });
            }
            pollInterval = setInterval(poll, 1000);
            poll();
            function renderResult(data) {
                const result = data.result;
                if (!result) {
                    showError('No result data received.');
                    return;
                }

                loadingEl.style.display = 'none';

                if (result.type === 'image') {
                    renderImage(result);
                } else if (result.type === 'content') {
                    renderContent(result);
                } else {
                    showError('Unknown result type: ' + result.type);
                }
            }
            function renderImage(result) {
                document.title = 'ScalableAI — Generated Image';
                const badge = document.createElement('span');
                badge.className = 'badge badge-image';
                badge.textContent = 'Generated Image';
                const container = document.createElement('div');
                container.className = 'image-container';
                const frame = document.createElement('div');
                frame.className = 'image-frame';
                const img = document.createElement('img');
                img.alt = result.prompt || 'Generated image';
                frame.appendChild(img);
                container.appendChild(badge);
                container.appendChild(frame);
                if (result.prompt) {
                    const prompt = document.createElement('div');
                    prompt.className = 'image-prompt';
                    prompt.textContent = `Prompt: "${result.prompt}"`;
                    container.appendChild(prompt);
                }
                mainEl.appendChild(container);
                authFetch(result.url)
                    .then(r => {
                        if (!r.ok) throw new Error(`HTTP ${r.status}`);
                        return r.blob();
                    })
                    .then(blob => { img.src = URL.createObjectURL(blob); })
                    .catch(() => showError('Failed to load image. The image may no longer be available.'));
                actionsEl.innerHTML = '';
                const downloadBtn = createBtn('Download', downloadSvg(), () => downloadImage(result.url, result.prompt));
                actionsEl.appendChild(downloadBtn);
                const copyUrlBtn = createBtn('Copy URL', copySvg(), () => {
                    navigator.clipboard.writeText(result.url).then(() => showToast('URL copied!'));
                });
                actionsEl.appendChild(copyUrlBtn);
            }
            /* Small, dependency-free markdown -> HTML renderer for generated
               content. Covers what the AI actually produces here: #/##/###
               headings, **bold**, *italic*, `code`, and - / * / 1. lists.
               HTML is escaped first so generated text can never inject
               markup, then a handful of regexes turn markdown syntax into
               real tags instead of showing the raw symbols. */
            function escapeHtml(str) {
                return str
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
            }
            function renderInline(text) {
                let html = escapeHtml(text);
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
                html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,!?]|$)/g, '$1<em>$2</em>');
                return html;
            }
            function renderMarkdown(raw) {
                if (!raw) return '';
                const lines = raw.replace(/\r\n/g, '\n').split('\n');
                let html = '';
                let listType = null; // 'ul' | 'ol' | null
                let paragraph = [];

                function flushParagraph() {
                    if (paragraph.length) {
                        html += '<p>' + renderInline(paragraph.join(' ')) + '</p>';
                        paragraph = [];
                    }
                }
                function closeList() {
                    if (listType) {
                        html += '</' + listType + '>';
                        listType = null;
                    }
                }

                for (const rawLine of lines) {
                    const line = rawLine.trim();

                    if (!line) {
                        flushParagraph();
                        closeList();
                        continue;
                    }

                    const heading = line.match(/^(#{1,3})\s+(.*)$/);
                    if (heading) {
                        flushParagraph();
                        closeList();
                        const level = heading[1].length;
                        html += '<h' + level + '>' + renderInline(heading[2]) + '</h' + level + '>';
                        continue;
                    }

                    const bullet = line.match(/^[-*]\s+(.*)$/);
                    if (bullet) {
                        flushParagraph();
                        if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
                        html += '<li>' + renderInline(bullet[1]) + '</li>';
                        continue;
                    }

                    const numbered = line.match(/^\d+[.)]\s+(.*)$/);
                    if (numbered) {
                        flushParagraph();
                        if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
                        html += '<li>' + renderInline(numbered[1]) + '</li>';
                        continue;
                    }

                    closeList();
                    paragraph.push(line);
                }
                flushParagraph();
                closeList();
                return html;
            }

            function renderContent(result) {
                document.title = 'ScalableAI — Generated Content';
                const container = document.createElement('div');
                container.className = 'content-container';
                const header = document.createElement('div');
                header.className = 'content-header';
                const meta = document.createElement('div');
                meta.className = 'content-meta';
                const badge = document.createElement('span');
                badge.className = 'badge badge-content';
                badge.textContent = 'Generated Content';
                meta.appendChild(badge);
                if (result.prompt) {
                    const prompt = document.createElement('div');
                    prompt.className = 'content-prompt';
                    prompt.textContent = `Prompt: "${result.prompt}"`;
                    meta.appendChild(prompt);
                }
                header.appendChild(meta);
                const actions = document.createElement('div');
                actions.className = 'content-actions';
                // Edit sits to the left of Copy / Download, as specified.
                const editBtn = createBtn('Edit', editSvg(), () => enterEditMode());
                actions.appendChild(editBtn);
                const copyBtn = createBtn('Copy', copySvg(), () => {
                    // Reads editor.value live, so this always reflects the
                    // latest saved edit — no separate "edited content"
                    // variable needed anywhere in this function.
                    navigator.clipboard.writeText(editor.value).then(() => showToast('Content copied!'));
                });
                actions.appendChild(copyBtn);
                const downloadTxtBtn = createBtn('Download .txt', downloadSvg(), () => {
                    downloadText(editor.value, 'scalable-content.txt');
                });
                actions.appendChild(downloadTxtBtn);
                const downloadMdBtn = createBtn('Download .md', downloadSvg(), () => {
                    downloadText(editor.value, 'scalable-content.md');
                });
                actions.appendChild(downloadMdBtn);
                header.appendChild(actions);
                container.appendChild(header);
                const editorWrap = document.createElement('div');
                editorWrap.className = 'content-editor-wrap';
                // Raw markdown source. Hidden while viewing the rendered
                // preview, shown in place of it during Live Edit. Copy /
                // Download / Copy All all read from here, so exported (and
                // re-rendered) content is always whatever was last saved.
                const editor = document.createElement('textarea');
                editor.className = 'content-editor';
                editor.value = result.text || '';
                editor.style.display = 'none';
                editor.setAttribute('aria-hidden', 'true');
                editorWrap.appendChild(editor);
                // Visible, formatted, view-only rendering of that same text.
                const preview = document.createElement('div');
                preview.className = 'content-preview';
                preview.innerHTML = renderMarkdown(editor.value) || '<p style="opacity:.5">Your content will appear here...</p>';
                editorWrap.appendChild(preview);

                // Divider + Cancel/Save row, hidden until edit mode opens.
                const editDivider = document.createElement('div');
                editDivider.className = 'content-edit-divider';
                editDivider.style.display = 'none';
                editorWrap.appendChild(editDivider);

                const editActions = document.createElement('div');
                editActions.className = 'content-edit-actions';
                editActions.style.display = 'none';
                let preEditValue = '';
                const cancelBtn = createBtn('Cancel', '', () => exitEditMode(false));
                const saveBtn = createBtn('Save', '', () => exitEditMode(true));
                saveBtn.classList.add('btn-primary');
                editActions.appendChild(cancelBtn);
                editActions.appendChild(saveBtn);
                editorWrap.appendChild(editActions);

                function enterEditMode() {
                    preEditValue = editor.value; // snapshot, restored on Cancel
                    preview.style.display = 'none';
                    editor.style.display = 'block';
                    editor.classList.add('live-edit-active');
                    editor.removeAttribute('aria-hidden');
                    editDivider.style.display = 'block';
                    editActions.style.display = 'flex';
                    editor.focus();
                }

                function exitEditMode(save) {
                    if (!save) {
                        editor.value = preEditValue; // discard changes
                    } else {
                        // Re-render the preview from the (now updated)
                        // editor.value. updateWordCount() also reads
                        // editor.value, so the count stays in sync too.
                        preview.innerHTML = renderMarkdown(editor.value) ||
                            '<p style="opacity:.5">Your content will appear here...</p>';
                        updateWordCount();
                    }
                    editor.style.display = 'none';
                    editor.classList.remove('live-edit-active');
                    editor.setAttribute('aria-hidden', 'true');
                    editDivider.style.display = 'none';
                    editActions.style.display = 'none';
                    preview.style.display = 'block';
                }

                const wordcount = document.createElement('div');
                wordcount.className = 'content-wordcount';
                function updateWordCount() {
                    const words = editor.value.trim().split(/\s+/).filter(Boolean).length;
                    const chars = editor.value.length;
                    wordcount.textContent = words + ' words / ' + chars + ' characters';
                }
                updateWordCount();
                editorWrap.appendChild(wordcount);
                container.appendChild(editorWrap);
                mainEl.appendChild(container);
                actionsEl.innerHTML = '';
                const topCopyBtn = createBtn('Copy All', copySvg(), () => {
                    // Same live editor.value read as the in-card Copy button
                    // above — always the latest saved content.
                    navigator.clipboard.writeText(editor.value).then(() => showToast('Copied!'));
                });
                topCopyBtn.classList.add('btn-primary');
                actionsEl.appendChild(topCopyBtn);
            }
            function createBtn(text, svgHtml, onClick) {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerHTML = svgHtml ? (svgHtml + ' ' + text) : text;
                btn.addEventListener('click', onClick);
                return btn;
            }
            function showError(msg) {
                loadingEl.style.display = 'none';
                const el = document.createElement('div');
                el.className = 'error-msg';
                el.textContent = msg;
                mainEl.appendChild(el);
            }
            function showToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                setTimeout(() => toastEl.classList.remove('show'), 2000);
            }
            function downloadImage(url, prompt) {
                authFetch(url)
                    .then(r => r.blob())
                    .then(blob => {
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = (prompt || 'scalable-image').replace(/[^a-z0-9 ]/gi, '').trim().replace(/\s+/g, '-').substring(0, 50) + '.png';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(a.href);
                        showToast('Download started!');
                    })
                    .catch(() => {
                        window.open(url, '_blank');
                        showToast('Opened image in new tab (download blocked by CORS)');
                    });
            }
            function downloadText(text, filename) {
                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
                showToast('Download started!');
            }
            function downloadSvg() {
                return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
            }
            function copySvg() {
                return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
            }
            function editSvg() {
                return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>';
            }
        })();
    </script>
</body>
